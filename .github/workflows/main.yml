name: Build and Release

on:
  release:
    types: [created]

jobs:
  build-windows-amd64:
    name: Build and Release for Windows/AMD64
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build Binary
        run: go build -o HWIDCHECK.exe main.go

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          $uploadUrl = "${{ github.event.release.upload_url }}" -replace '\{.*', ''
          curl.exe -sL -X POST -H "Authorization: token $env:GITHUB_TOKEN" -H "Content-Type: application/octet-stream" "${uploadUrl}?name=HWIDCHECK.exe" --data-binary "@HWIDCHECK.exe"
